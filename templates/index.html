<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loja Aluno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--fg:#e8f0ff;--mut:#7d8aa8}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:#02040a;color:var(--fg);font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none}
button{font-family:inherit}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
header{z-index:2;position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:20px 28px;pointer-events:none}
.logo{font-weight:800;letter-spacing:.2em;font-size:14px}
.logo b{color:#00e5ff}
.hint{font-size:12px;color:var(--mut);letter-spacing:.08em}
#bg{pointer-events:none;cursor:default}
.dir{display:flex;align-items:center;gap:16px;pointer-events:auto}
#pal{cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:var(--fg);border-radius:999px;padding:7px 16px;font-size:12px;letter-spacing:.08em;backdrop-filter:blur(8px)}
#pal:hover{background:rgba(255,255,255,.16)}
body.claro{--fg:#10231c;--mut:#4a6a5c}
body.claro .logo b{color:#1f7a5c}
body.claro .info button,body.claro #pal{border-color:rgba(16,35,28,.3);background:rgba(16,35,28,.06)}
#modal,#toast{--fg:#e8f0ff;--mut:#7d8aa8}
#cb{cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:var(--fg);border-radius:999px;padding:7px 16px;font-size:12px;letter-spacing:.08em;backdrop-filter:blur(8px)}
#cb:hover{background:rgba(255,255,255,.16)}
#cb b{background:#22d3ee;color:#02040a;border-radius:999px;padding:1px 8px;margin-left:8px;font-size:11px}
body.claro #cb{border-color:rgba(16,35,28,.3);background:rgba(16,35,28,.06)}
#cart,#chk{--fg:#e8f0ff;--mut:#7d8aa8;color:var(--fg)}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:6;transform:translateX(100%);transition:transform .35s;background:rgba(10,14,28,.96);border-left:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);display:flex;flex-direction:column}
#cart.on{transform:none}
.ch{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:700;font-size:18px}
#citens{flex:1;overflow:auto;padding:8px 20px;touch-action:pan-y}
.vz{color:var(--mut);text-align:center;padding:40px 0}
.ci{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.cinfo b{display:block;font-size:15px}
.cinfo small{color:var(--mut)}
.cq{display:flex;align-items:center;gap:8px}
.csub{grid-column:1/-1;text-align:right;font-weight:600}
.crm{grid-column:3;grid-row:1}
.cf{padding:18px 20px;border-top:1px solid rgba(255,255,255,.1)}
.tot{display:flex;justify-content:space-between;font-size:18px;margin-bottom:14px}
#cart button,#chk button{cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px}
#cart button:hover,#chk button:hover{background:rgba(255,255,255,.16)}
#cart button:disabled,#chk button:disabled{opacity:.4;cursor:not-allowed}
#cfin,#cconf,#cnovo{width:100%;padding:12px!important;background:#22d3ee!important;color:#02040a!important;border-color:#22d3ee!important;font-weight:700}
#cvolta{width:100%;margin-top:8px;padding:10px!important}
#chk{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.78);backdrop-filter:blur(10px)}
#chk.on{display:flex}
.cbox{width:min(480px,94vw);max-height:92vh;overflow:auto;background:rgba(12,18,34,.97);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:24px;touch-action:pan-y}
.cbox h2{margin:0 0 14px;font-size:22px}
.cbox label{display:block;font-size:12px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.cbox input[type=text],.cbox input[type=email]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--fg);font:inherit;margin:6px 0 14px;user-select:text;-webkit-user-select:text}
.pgs{display:flex;gap:8px;margin:6px 0 16px}
.pgs label{flex:1;margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.pgs input{display:none}
.pgs label:has(input:checked){border-color:#22d3ee;background:rgba(34,211,238,.12)}
.res{border-top:1px solid rgba(255,255,255,.1);margin:6px 0 14px;padding-top:12px;font-size:14px}
.res div{display:flex;justify-content:space-between;padding:3px 0}
.aviso{font-size:12px;color:var(--mut);margin:10px 0 0;text-align:center}
#cerr{color:#f87171;font-size:14px;min-height:20px;margin-bottom:8px}
.info{z-index:2;position:fixed;left:0;right:0;bottom:26px;text-align:center;padding:0 16px;pointer-events:none}
.info small{display:block;font-size:11px;letter-spacing:.25em;color:var(--mut);text-transform:uppercase}
.info h1{margin:6px 0 4px;font-size:clamp(22px,4vw,34px);font-weight:700}
.info p{margin:0 0 14px;font-size:17px;font-weight:600}
.info button{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:var(--fg);padding:10px 26px;border-radius:999px;font-size:13px;letter-spacing:.08em;backdrop-filter:blur(8px)}
.info button:hover{background:rgba(255,255,255,.16)}
.info button:disabled{opacity:.4;cursor:not-allowed}
.qty{display:inline-flex;align-items:center;gap:12px;margin-right:14px;pointer-events:auto}
.qty button{padding:8px 14px;font-size:16px}
.qty span{min-width:20px;font-weight:600}
#toast{z-index:3;position:fixed;top:70px;left:50%;transform:translate(-50%,-20px);opacity:0;padding:12px 22px;border-radius:12px;background:rgba(10,16,32,.92);border:1px solid rgba(255,255,255,.2);font-size:14px;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:#2eff9a}
#toast.err{border-color:#ff4d6d}
#bv{margin-right:14px}
#acoes{display:none}
#acoes.on{display:block}
#modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.75);backdrop-filter:blur(10px)}
#modal.on{display:flex}
.box{position:relative;width:min(920px,94vw);height:min(640px,84vh);background:rgba(12,18,34,.94);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
#modal button{cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:var(--fg);border-radius:999px;font-size:13px;padding:6px 16px}
#modal button.on{background:#00e5ff;color:#02040a;border-color:#00e5ff}
#mx{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;padding:0!important;border-radius:50%!important}
.tabs{display:flex;gap:8px;min-height:30px;padding-right:44px}
#media{flex:1;min-height:0;border-radius:12px;overflow:hidden;background:#02040a}
#media>*{width:100%;height:100%;display:block;object-fit:contain}
.vazio{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:15px;text-align:center;padding:20px}
.mi h2{margin:0;font-size:20px}
.mi p{margin:2px 0 0;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header><div class="logo">LOJA<b>ALUNO</b></div><div class="dir"><div class="hint">ARRASTE PARA GIRAR · CLIQUE PARA SELECIONAR</div><button id="cb">Carrinho<b id="cn">0</b></button><button id="pal">Paleta</button></div></header>
<div class="info"><small id="tag"></small><h1 id="name">Carregando…</h1><p id="price"></p><div id="acoes"><button id="bv">Ver 3D / vídeo</button><span class="qty"><button id="qm">−</button><span id="q">1</span><button id="qp">+</button></span><button id="btn">Adicionar ao carrinho</button></div></div>
<div id="toast"></div>
<aside id="cart"><div class="ch"><span>Seu carrinho</span><button id="cx">✕</button></div><div id="citens"></div>
<div class="cf"><div class="tot"><span>Total</span><b id="ctot">R$ 0,00</b></div><button id="cfin">Finalizar compra</button></div></aside>
<div id="chk"><div class="cbox">
<div id="cform"><h2>Finalizar compra</h2>
<label for="cnome">Nome</label><input id="cnome" type="text" autocomplete="name" maxlength="80">
<label for="cmail">E-mail</label><input id="cmail" type="email" autocomplete="email" maxlength="120">
<label>Pagamento</label>
<div class="pgs"><label><input type="radio" name="pag" value="pix" checked>Pix</label><label><input type="radio" name="pag" value="cartao">Cartão</label><label><input type="radio" name="pag" value="boleto">Boleto</label></div>
<div class="res" id="cres"></div><div id="cerr"></div>
<button id="cconf">Confirmar pedido</button><button id="cvolta">Voltar</button>
<p class="aviso">Pagamento simulado: nenhum dado de cartão é coletado.</p></div>
<div id="cok" style="display:none"></div></div></div>
<div id="modal"><div class="box"><button id="mx">✕</button><div class="tabs" id="tabs"></div><div id="media"></div><div class="mi"><h2 id="mt"></h2><p id="mp"></p></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
const PAL=[['#22d3ee','#0e7490'],['#a78bfa','#5b21b6'],['#f59e0b','#b45309'],['#34d399','#047857'],['#f472b6','#9d174d'],['#60a5fa','#1d4ed8'],['#fb923c','#c2410c'],['#f87171','#b91c1c']];
const MAXN=16;
const $=id=>document.getElementById(id);
const BRL=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let ctx,ACC='#fff';
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function icon(k){
ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ACC;ctx.fillStyle='rgba(255,255,255,.06)';
const B=(x,y,w,h,r)=>{rr(x,y,w,h,r);ctx.fill();ctx.stroke()};
const L=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()};
const C=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke()};
if(k=='gpu'){B(80,240,352,140,16);C(190,310,50);C(322,310,50);C(190,310,14);C(322,310,14);L(100,395,412,395)}
if(k=='mouse'){B(190,200,132,200,62);L(256,200,256,285);B(246,225,20,40,10)}
if(k=='kb'){B(60,230,392,190,20);for(let r=0;r<3;r++)for(let c=0;c<8;c++){rr(84+c*45,254+r*48,34,34,7);ctx.stroke()}}
if(k=='chair'){B(190,170,132,170,40);B(170,355,172,38,16);L(256,393,256,445);L(185,462,327,462)}
if(k=='head'){ctx.beginPath();ctx.arc(256,320,115,Math.PI,0);ctx.stroke();B(130,310,56,110,22);B(326,310,56,110,22)}
if(k=='mon'){B(75,215,362,215,16);L(256,430,256,470);L(195,478,317,478)}
if(k=='mic'){B(206,185,100,175,50);ctx.beginPath();ctx.arc(256,295,82,0,Math.PI);ctx.stroke();L(256,377,256,430);L(204,440,308,440)}
if(k=='pad'){B(60,250,392,170,34);C(256,335,30)}
if(k=='ram'){B(70,265,372,95,10);for(let i=0;i<4;i++){rr(102+i*82,288,56,50,6);ctx.stroke()}for(let i=0;i<9;i++)L(96+i*40,375,96+i*40,398)}
if(k=='pc'){B(170,170,172,290,18);C(256,270,46);C(256,270,12);L(200,410,312,410)}
if(k=='chip'){B(150,230,212,212,20);B(200,280,112,112,10);for(let i=0;i<3;i++){const p=200+i*56,q=280+i*56;L(p,198,p,230);L(p,442,p,474);L(118,q,150,q);L(362,q,394,q)}}
}
function pintar(cv,d,im){
ctx=cv.getContext('2d');ctx.clearRect(0,0,512,704);ACC=d.c[0];
const W=512,H=704;
let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#151c33');g.addColorStop(1,'#080b16');
rr(8,8,496,688,36);ctx.fillStyle=g;ctx.fill();
ctx.save();rr(8,8,496,688,36);ctx.clip();
g=ctx.createRadialGradient(256,250,10,256,250,300);g.addColorStop(0,ACC+'40');g.addColorStop(1,ACC+'00');
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
g=ctx.createLinearGradient(0,0,W,260);g.addColorStop(0,'rgba(255,255,255,.14)');g.addColorStop(1,'rgba(255,255,255,0)');
ctx.fillStyle=g;ctx.fillRect(0,0,W,260);
ctx.restore();
rr(36,40,440,420,26);ctx.fillStyle='rgba(255,255,255,.05)';ctx.fill();
ctx.save();rr(36,40,440,420,26);ctx.clip();
if(im){const k=Math.max(440/im.width,420/im.height),w=im.width*k,h=im.height*k;ctx.drawImage(im,36+(440-w)/2,40+(420-h)/2,w,h)}
else{ctx.translate(0,-50);icon(d.i)}
ctx.restore();
rr(36,40,440,420,26);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=2;ctx.stroke();
ctx.textAlign='left';
ctx.fillStyle=ACC;ctx.beginPath();ctx.arc(48,500,6,0,7);ctx.fill();
ctx.fillStyle='rgba(232,240,255,.7)';ctx.font='700 18px Outfit,system-ui,sans-serif';ctx.letterSpacing='3px';ctx.fillText(d.t.toUpperCase(),64,507);ctx.letterSpacing='0px';
ctx.fillStyle='#fff';let fs=38;do{ctx.font='700 '+fs+'px Outfit,system-ui,sans-serif';fs-=2}while(ctx.measureText(d.n).width>436&&fs>20);
ctx.fillText(d.n,38,556);
ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(38,584,436,2);
ctx.fillStyle='#fff';ctx.font='800 40px Outfit,system-ui,sans-serif';ctx.fillText(BRL(d.price),38,640);
ctx.textAlign='right';ctx.fillStyle=ACC;ctx.font='700 26px Outfit,system-ui,sans-serif';ctx.fillText('★ '+d.a.toFixed(1),474,640);
ctx.textAlign='left';ctx.font='600 18px Outfit,system-ui,sans-serif';ctx.fillStyle=d.e<1?'#f87171':d.e<=2?'#fbbf24':'#7d8aa8';
ctx.fillText(d.e<1?'Esgotado':d.e<=2?'Últimas unidades':'Em estoque',38,672);
g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,ACC);g.addColorStop(.35,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,.05)');
rr(8,8,496,688,36);ctx.strokeStyle=g;ctx.lineWidth=3;ctx.stroke();
}
function tex(d){const cv=document.createElement('canvas');cv.width=512;cv.height=704;pintar(cv,d,null);
const t=new THREE.CanvasTexture(cv);t.anisotropy=8;d.cv=cv;d.tx=t;
if(d.img){const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{d.im=im;pintar(cv,d,im);t.needsUpdate=true};im.src=d.img}
return t;
}
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,1,.1,100);
const ring=new THREE.Group();scene.add(ring);
const geo=new THREE.PlaneGeometry(2,2.75);
const uP=Array.from({length:MAXN},()=>new THREE.Vector2(999,999));
const uC=Array.from({length:MAXN},()=>new THREE.Vector3());
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShaderMaterial({
transparent:true,depthWrite:false,
uniforms:{uT:{value:0},uC:{value:uC},uP:{value:uP},uBase:{value:new THREE.Color(.02,.03,.05)}},
vertexShader:'varying vec2 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xz;gl_Position=projectionMatrix*viewMatrix*w;}',
fragmentShader:`varying vec2 vW;uniform float uT;uniform vec3 uC[${MAXN}];uniform vec2 uP[${MAXN}];uniform vec3 uBase;
void main(){vec3 g=vec3(0.);
for(int i=0;i<${MAXN};i++){float d=length(vW-uP[i]);
float ring=.5+.5*sin(d*6.-uT*2.2+float(i));
float wob=.5+.5*sin(vW.x*3.+uT*1.3)*sin(vW.y*3.-uT);
g+=uC[i]*exp(-d*d*.22)*(.28+.45*ring*wob);}
float far=smoothstep(16.,5.,length(vW));
float fade=smoothstep(26.,9.,length(vW));gl_FragColor=vec4(g*far+uBase,(.8+min(length(g),1.)*.2)*fade);}`
}));
floor.rotation.x=-Math.PI/2;floor.renderOrder=2;scene.add(floor);

let P=[],cards=[],refl=[],N=0,STEP=1,R=4.6,th=0,vel=0,drag=false,lx=0,cur=-1,qtd=1,parado=false,alvo=null,sel=-1,lastVis=false,st=[],baseC=[];
function iniciar(lista){
const cm={};
P=lista.map(p=>{const k=p.categoria;if(!(k in cm))cm[k]=Object.keys(cm).length%PAL.length;
return{n:p.nome,price:p.preco,t:p.categoria,i:p.icone,c:PAL[cm[k]],e:p.estoque,a:p.avaliacao,k:p.chave,m:p.modelo3d,v:p.video,img:p.imagem}});
N=P.length;STEP=Math.PI*2/N;R=Math.max(4.6,N*2.5/(Math.PI*2));
P.forEach((d,i)=>{
const t=tex(d);
const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:t,transparent:true,alphaTest:.05,side:THREE.DoubleSide}));
const r=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:.3,depthWrite:false,side:THREE.DoubleSide}));
[m,r].forEach(o=>{o.position.set(Math.sin(i*STEP)*R,0,Math.cos(i*STEP)*R);o.rotation.y=i*STEP;ring.add(o)});
m.position.y=1.65;m.renderOrder=3;r.position.y=-1.65;r.scale.y=-1;r.renderOrder=1;
cards.push(m);refl.push(r);
const c=new THREE.Color(d.c[0]).lerp(new THREE.Color(d.c[1]),.4);uC[i].set(c.r,c.g,c.b);baseC.push(new THREE.Vector3(c.r,c.g,c.b));st.push({b:.5,s:1,g:1});
});
size();
}
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{drag=true;parado=false;alvo=null;sel=-1;lx=e.clientX;vel=0;cvs.setPointerCapture(e.pointerId)});
cvs.addEventListener('pointermove',e=>{if(!drag)return;const d=(e.clientX-lx)*.006;lx=e.clientX;th+=d;vel=d});
['pointerup','pointercancel'].forEach(n=>cvs.addEventListener(n,()=>drag=false));
function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;
const z=R+(w/h<.8?10.4:5.2);cam.position.set(0,2.4,z);cam.lookAt(0,1.2,0);cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
const clock=new THREE.Clock();
(function loop(){
requestAnimationFrame(loop);
const t=clock.getElapsedTime();
if(N){
if(alvo!==null&&!drag){th+=(alvo-th)*.12;if(Math.abs(alvo-th)<.0005){th=alvo;alvo=null}}
else if(!drag){th+=vel;vel*=.95;if(!parado&&Math.abs(vel)<.0008)th+=.0012}
ring.rotation.y=th;
let best=0,bz=-99;
for(let i=0;i<N;i++){
const a=i*STEP+th,x=Math.sin(a)*R,z=Math.cos(a)*R,q=st[i],on=i===sel;
uP[i].set(x,z);
const dep=.35+.65*(z+R)/(2*R);
q.b+=((sel<0?dep:on?1:.2)-q.b)*.12;
q.s+=((on?1.2:1)-q.s)*.12;
q.g+=((sel<0?1:on?2.2:.3)-q.g)*.12;
const k=R+(q.s-1)*1.5,px=Math.sin(i*STEP)*k,pz=Math.cos(i*STEP)*k,y=1.65+Math.sin(t*1.2+i)*.06+(q.s-1)*1.4;
cards[i].material.color.setScalar(q.b);
cards[i].scale.set(q.s,q.s,1);cards[i].position.set(px,y,pz);
refl[i].scale.set(q.s,-q.s,1);refl[i].position.set(px,-y,pz);refl[i].material.opacity=.3*Math.min(q.b,1);
uC[i].copy(baseC[i]).multiplyScalar(q.g);
if(z>bz){bz=z;best=i}
}
const vis=sel===best;if(vis!==lastVis){lastVis=vis;$('acoes').classList.toggle('on',vis)}

}
floor.material.uniforms.uT.value=t;

})();
function mostrar(){const d=P[cur];if(!d)return;
$('tag').textContent=d.t;$('name').textContent=d.n;
$('price').textContent=BRL(d.price)+' · ★ '+d.a.toFixed(1)+' · '+d.e+(d.e==1?' unidade':' unidades');

function aviso(msg,tipo){const t=$('toast');t.textContent=msg;t.className='on '+tipo;clearTimeout(aviso.h);aviso.h=setTimeout(()=>t.className='',3500)}
$('qm').onclick=()=>{if(qtd>1){qtd--;mostrar()}};
$('qp').onclick=()=>{if(P[cur]&&qtd<P[cur].e){qtd++;mostrar()}};
function el(t,c,tx,fn){const e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;if(fn)e.onclick=fn;return e}
let carrinho=[];
try{carrinho=JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){carrinho=[]}
if(!Array.isArray(carrinho))carrinho=[];
carrinho=carrinho.filter(x=>x&&typeof x.k=='string'&&+x.q>0).map(x=>({k:x.k,n:String(x.n),p:+x.p||0,q:Math.floor(+x.q)||1,max:Math.floor(+x.max)||1}));
function salvar(){try{localStorage.setItem('cart',JSON.stringify(carrinho))}catch(e){}renderCart()}
function totalCart(){return carrinho.reduce((a,x)=>a+x.q*x.p,0)}
function renderCart(){
$('cn').textContent=carrinho.reduce((a,x)=>a+x.q,0);$('ctot').textContent=BRL(totalCart());
$('cfin').disabled=!carrinho.length;
const box=$('citens');box.innerHTML='';
if(!carrinho.length)box.append(el('div','vz','Seu carrinho está vazio.'));
carrinho.forEach(x=>{
const row=el('div','ci'),info=el('div','cinfo'),qt=el('div','cq');
info.append(el('b',null,x.n),el('small',null,BRL(x.p)+' cada'));
qt.append(el('button',null,'−',()=>{x.q--;if(x.q<1)carrinho=carrinho.filter(y=>y!==x);salvar()}),el('span',null,x.q),el('button',null,'+',()=>{if(x.q<x.max){x.q++;salvar()}}));
row.append(info,qt,el('button','crm','✕',()=>{carrinho=carrinho.filter(y=>y!==x);salvar()}),el('div','csub',BRL(x.q*x.p)));
box.append(row)})}
function sincCart(){
carrinho=carrinho.filter(x=>P.some(d=>d.k===x.k));
carrinho.forEach(x=>{const d=P.find(y=>y.k===x.k);x.n=d.n;x.p=d.price;x.max=d.e;x.q=Math.min(x.q,d.e)});
carrinho=carrinho.filter(x=>x.q>0);salvar()}
$('btn').onclick=()=>{const d=P[cur];if(!d||d.e<1)return;
const ja=(carrinho.find(x=>x.k===d.k)||{q:0}).q;
if(ja>=d.e){aviso('Você já tem todo o estoque no carrinho','err');return}
const q=Math.min(qtd,d.e-ja),it=carrinho.find(x=>x.k===d.k);
if(it){it.q+=q;it.max=d.e;it.p=d.price}else carrinho.push({k:d.k,n:d.n,p:d.price,q:q,max:d.e});
salvar();aviso(q+' × '+d.n+' no carrinho','ok');qtd=1;mostrar()};
$('cb').onclick=()=>$('cart').classList.toggle('on');
$('cx').onclick=()=>$('cart').classList.remove('on');
function abrirChk(){if(!carrinho.length)return;
const r=$('cres');r.innerHTML='';
carrinho.forEach(x=>{const l=el('div');l.append(el('span',null,x.q+'× '+x.n),el('span',null,BRL(x.q*x.p)));r.append(l)});
const t=el('div');t.style.fontWeight='700';t.append(el('span',null,'Total'),el('span',null,BRL(totalCart())));r.append(t);
$('cerr').textContent='';$('cform').style.display='block';$('cok').style.display='none';$('chk').classList.add('on')}
$('cfin').onclick=abrirChk;
$('cvolta').onclick=()=>$('chk').classList.remove('on');
function sucesso(j){
for(const k in (j.estoques||{})){const d=P.find(y=>y.k===k);if(d){d.e=j.estoques[k];if(d.cv){pintar(d.cv,d,d.im||null);d.tx.needsUpdate=true}}}
carrinho=[];salvar();mostrar();
const ok=$('cok');ok.innerHTML='';
const b=el('button',null,'Continuar comprando',()=>{$('chk').classList.remove('on');$('cart').classList.remove('on')});b.id='cnovo';
ok.append(el('h2',null,'Pedido confirmado! 🎉'),el('p',null,'Número do pedido: '+j.numero),el('p',null,'Total: '+BRL(j.total)),el('p','aviso','Pagamento simulado. O estoque já foi atualizado.'),b);
$('cform').style.display='none';ok.style.display='block'}
async function confirmar(){
const nome=$('cnome').value.trim(),email=$('cmail').value.trim(),pag=document.querySelector('input[name=pag]:checked').value,er=$('cerr');
if(nome.length<2){er.textContent='Informe seu nome.';return}
if(!/^\S+@\S+\.\S+$/.test(email)){er.textContent='E-mail inválido.';return}
er.textContent='';$('cconf').disabled=true;
try{const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cliente:{nome:nome,email:email},pagamento:pag,itens:carrinho.map(x=>({produto:x.k,quantidade:x.q}))})});
const j=await r.json();if(j.ok)sucesso(j);else er.textContent=j.erro||'Erro ao finalizar.'}
catch(e){er.textContent='Falha de conexão com o servidor.'}
$('cconf').disabled=false}
$('cconf').onclick=confirmar;
addEventListener('keydown',e=>{if(e.key=='Escape'){if($('chk').classList.contains('on'))$('chk').classList.remove('on');else $('cart').classList.remove('on')}});
renderCart();
const rc=new THREE.Raycaster(),mv=new THREE.Vector2();let sx=0,sy=0;
cvs.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
cvs.addEventListener('click',e=>{if(!N||Math.hypot(e.clientX-sx,e.clientY-sy)>6)return;
mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(mv,cam);
const h=rc.intersectObjects(cards);if(h.length)selecionar(cards.indexOf(h[0].object));else soltar()});
function selecionar(i){sel=i;parado=true;vel=0;{let x=(-i*STEP-th)%(Math.PI*2);if(x>Math.PI)x-=Math.PI*2;if(x<-Math.PI)x+=Math.PI*2;alvo=th+x}}
function soltar(){sel=-1;parado=false;alvo=null}
function midia(tipo,url){const m=$('media');m.innerHTML='';let el;
if(tipo=='3d'){el=document.createElement('model-viewer');el.setAttribute('src',url);['camera-controls','auto-rotate','ar'].forEach(a=>el.setAttribute(a,''));el.setAttribute('shadow-intensity','1')}
else{el=document.createElement('video');el.src=url;el.controls=true;el.autoplay=true;el.muted=true;el.loop=true;el.playsInline=true}
m.appendChild(el);
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tipo))}
function abrir(i){const d=P[i];if(!d)return;
$('mt').textContent=d.n;$('mp').textContent=BRL(d.price)+' · '+d.t;
const op=[];if(d.m)op.push(['3d','Modelo 3D',d.m]);if(d.v)op.push(['video','Vídeo',d.v]);
const tb=$('tabs');tb.innerHTML='';$('media').innerHTML='';
if(!op.length)$('media').innerHTML='<div class="vazio">Este produto ainda não tem modelo 3D nem vídeo.</div>';
else{op.forEach(([t,l,u])=>{const b=document.createElement('button');b.textContent=l;b.dataset.t=t;b.onclick=()=>midia(t,u);tb.appendChild(b)});
tb.style.visibility=op.length>1?'visible':'hidden';midia(op[0][0],op[0][2])}
$('modal').classList.add('on')}
function fechar(){$('modal').classList.remove('on');$('media').innerHTML=''}
$('mx').onclick=fechar;$('modal').onclick=e=>{if(e.target.id=='modal')fechar()};
addEventListener('keydown',e=>{if(e.key=='Escape'){if($('modal').classList.contains('on'))fechar();else soltar()}});
$('bv').onclick=()=>abrir(cur);
fetch('/api/produtos').then(r=>{if(!r.ok)throw 0;return r.json()}).then(l=>{if(!l.length)throw 0;
return Promise.all(['600','700','800'].map(w=>document.fonts.load(w+' 20px Outfit')))
.catch(()=>{}).then(()=>{iniciar(l);sincCart()})})
.catch(()=>{$('tag').textContent='Verifique se o servidor Flask está rodando';$('name').textContent='Não foi possível carregar os produtos'});
</script>
<script>
(function(){
const PAL2=[
{n:'Noir',c:['#08090b','#2f3237','#8b9099','#f3f4f6'],f:'#050608'},
{n:'Mint',c:['#f7f4e8','#dcecd9','#9ccfb2','#5c9c85'],f:'#12302a',claro:1},
{n:'Plum',c:['#180814','#48103e','#95275f','#e07a9c'],f:'#0f0510'},
{n:'Neon',c:['#04060a','#7dff4d','#ff2f92','#29e6ff'],f:'#02040a'}];
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255);
let idx=0;try{idx=Math.min(PAL2.length-1,Math.max(0,+localStorage.getItem('pal')||0))}catch(e){}
const cur=PAL2[idx].c.map(rgb),tg=cur.map(c=>c.slice());
const fl=new THREE.Color(PAL2[idx].f),ft=fl.clone();
const cv=$('bg');let gl=null;
try{gl=cv.getContext('webgl',{antialias:false,alpha:false})}catch(e){}
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 u_res;uniform float u_t;uniform vec2 u_m;
uniform vec3 c0;uniform vec3 c1;uniform vec3 c2;uniform vec3 c3;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*vn(p);p*=2.02;a*=.5;}return v;}
float b2(vec2 v){return mod(2.*v.x+3.*v.y,4.);}
float bayer(vec2 c){return (4.*b2(mod(c,2.))+b2(mod(floor(c*.5),2.))+.5)/16.-.5;}
void main(){
vec2 p=(gl_FragCoord.xy-.5*u_res)/min(u_res.x,u_res.y)*1.6+u_m*.35;
vec2 orb=vec2(cos(u_t),sin(u_t))*.55;
vec2 q=vec2(fbm(p+orb),fbm(p+orb.yx+3.1));
vec2 r=vec2(fbm(p+2.*q+orb*1.3+1.7),fbm(p+2.*q-orb+9.2));
float f=fbm(p+1.8*r);
float g=clamp((f-.25)/.5,0.,1.);
float s=length(q);
vec3 col=mix(c0,c1,smoothstep(0.,.45,g));
col=mix(col,c2,smoothstep(.35,.78,g));
col=mix(col,c3,min(1.,smoothstep(.62,1.,g)*(.55+.45*s)));
col+=bayer(floor(gl_FragCoord.xy))*.016;
gl_FragColor=vec4(col,1.);
}`;
let uR,uT,uM,uc=[];
if(gl){
const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);return o};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){gl=null}
else{gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);uR=U('u_res');uT=U('u_t');uM=U('u_m');uc=[0,1,2,3].map(i=>U('c'+i))}
}
if(!gl)cv.style.display='none';
function resize(){if(!gl)return;const d=Math.min(devicePixelRatio||1,1.5);
cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',resize);resize();
const tm=[0,0],m=[0,0];
addEventListener('pointermove',e=>{tm[0]=e.clientX/innerWidth*2-1;tm[1]=-(e.clientY/innerHeight*2-1)});
function aplicar(i){idx=i;const p=PAL2[i];
p.c.forEach((h,k)=>{tg[k]=rgb(h)});ft.set(p.f);
document.body.classList.toggle('claro',!!p.claro);
$('pal').textContent='Paleta · '+p.n;
if(!gl)document.body.style.background='linear-gradient(135deg,'+p.c.join(',')+')';
try{localStorage.setItem('pal',i)}catch(e){}}
$('pal').onclick=()=>aplicar((idx+1)%PAL2.length);
aplicar(idx);
const reduz=matchMedia('(prefers-reduced-motion: reduce)').matches,PER=24;
function fr(now){requestAnimationFrame(fr);
for(let i=0;i<4;i++)for(let k=0;k<3;k++)cur[i][k]+=(tg[i][k]-cur[i][k])*.06;
fl.lerp(ft,.06);floor.material.uniforms.uBase.value.copy(fl);
if(!gl)return;
m[0]+=(tm[0]-m[0])*.04;m[1]+=(tm[1]-m[1])*.04;
gl.uniform2f(uR,cv.width,cv.height);
gl.uniform1f(uT,reduz?0:((now/1000/PER)%1)*Math.PI*2);
gl.uniform2f(uM,m[0],m[1]);
for(let i=0;i<4;i++)gl.uniform3f(uc[i],cur[i][0],cur[i][1],cur[i][2]);
gl.drawArrays(gl.TRIANGLES,0,3)}
requestAnimationFrame(fr);
})();
</script>
